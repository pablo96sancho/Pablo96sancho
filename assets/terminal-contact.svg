<svg xmlns="http://www.w3.org/2000/svg" width="760" height="224" viewBox="0 0 760 224" xml:space="preserve" role="img" aria-label="Terminal: email pablo96sancho@gmail.com, LinkedIn linkedin.com/in/pablo-sancho-alegre">
